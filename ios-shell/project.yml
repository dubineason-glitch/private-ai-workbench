name: PrivateAIWorkbench
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PrivateAIWorkbench:
    type: application
    platform: iOS
    sources:
      - path: PrivateAIWorkbench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.private.aiworkbench
        PRODUCT_NAME: PrivateAIWorkbench
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "私人 AI 工作台"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    scheme:
      testTargets: []
