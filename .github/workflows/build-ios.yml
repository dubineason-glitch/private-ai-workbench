name: Build iOS Shell IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "iOS Bundle ID"
        required: false
        default: "com.private.aiworkbench"
        type: string

jobs:
  build-ios:
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          cd ios-shell
          xcodegen generate
          xcodebuild -list -project PrivateAIWorkbench.xcodeproj

      - name: Build unsigned iOS shell
        env:
          APP_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          xcodebuild \
            -project ios-shell/PrivateAIWorkbench.xcodeproj \
            -scheme PrivateAIWorkbench \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Locate app
        run: |
          APP_PATH=$(find build/Build/Products -type d -name "PrivateAIWorkbench.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "PrivateAIWorkbench.app not found"
            find build -maxdepth 6 -type d -name "*.app" -print
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Found: $APP_PATH"

      - name: Create unsigned IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/PrivateAIWorkbench.app
          zip -qry PrivateAIWorkbench-Shell-unsigned.ipa Payload
          ls -lh PrivateAIWorkbench-Shell-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PrivateAIWorkbench-Shell-unsigned-ipa
          path: PrivateAIWorkbench-Shell-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
